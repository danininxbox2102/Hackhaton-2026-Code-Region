name: Native foundation
on:
  pull_request:
    paths:
      - 'Desktop/**'
      - 'Mobile/**'
      - 'scripts/build-native.mjs'
      - 'tests/native-foundation.test.mjs'
      - 'Frontend/src/entities/vacancyDetails.ts'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'Desktop/**'
      - 'Mobile/**'
      - 'scripts/build-native.mjs'
      - 'tests/native-foundation.test.mjs'
      - 'Frontend/src/entities/vacancyDetails.ts'
      - '.github/workflows/native.yml'
jobs:
  portable-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: node --test tests/native-foundation.test.mjs Desktop/test/*.test.cjs
      - run: npm ci
        working-directory: Frontend
      - run: npm run typecheck
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend
      - run: node scripts/build-native.mjs
        env:
          VITE_API_URL: https://example.org
